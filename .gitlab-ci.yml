# Le même pipeline en GitLab CI, pour comparer les outils (la démo utilise GitHub Actions).
# GitHub Actions -> GitLab CI : workflow -> pipeline, job -> job, needs -> needs,
# environment + reviewers -> environment + when: manual, GitHub Pages -> GitLab Pages (job "pages").

stages: [quality, test, build, release, deploy]

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  APP_VERSION: "1.0.$CI_PIPELINE_IID"

quality:
  stage: quality
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check

test:
  stage: test
  parallel:
    matrix:
      - NODE: ["22", "24"]
  image: node:$NODE-alpine
  script:
    - npm run test:cov

audit:
  stage: test
  script:
    - npm audit --audit-level=high --omit=dev

build:
  stage: build
  variables:
    VITE_APP_VERSION: $APP_VERSION
    VITE_GIT_SHA: $CI_COMMIT_SHA
    VITE_ENVIRONMENT: production
  script:
    - npm run build
  artifacts:
    paths: [dist/]

image:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  before_script: []
  needs: [build]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:v$APP_VERSION" .
    - docker push "$CI_REGISTRY_IMAGE:v$APP_VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  before_script: []
  needs: [build]
  script:
    - mv dist public
  artifacts:
    paths: [public]
  environment:
    name: production
  when: manual # porte d'approbation = Livraison Continue
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
